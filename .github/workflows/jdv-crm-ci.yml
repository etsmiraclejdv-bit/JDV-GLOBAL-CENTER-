name: JDV CRM integration CI

on:
  push:
    branches:
      - integration/jdv-crm-alias-fix
  pull_request:
    branches:
      - main
    paths:
      - '**.ts'
      - '**.tsx'
      - '**.js'
      - '**.jsx'
      - 'package.json'
      - 'package-lock.json'
      - 'supabase/migrations/**'
      - 'tsconfig.json'
      - '.github/workflows/jdv-crm-ci.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Build
        env:
          STRICT_BUILD: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
